name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the "latest" release with the APK

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4

      # The runner ships an Android SDK with licences accepted; make sure API 37 is there.
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Name the APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          name="TapShare-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

      # Only for main: replace the rolling "latest" pre-release so the phone always downloads the newest APK.
      - name: Publish to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TapShare — latest debug build" \
            --notes "Built from ${GITHUB_SHA::7}. Install on Android 10+ (allow 'Install unknown apps' for your browser/Files app)."
